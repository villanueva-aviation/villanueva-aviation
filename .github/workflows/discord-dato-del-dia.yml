name: Dato del día (Discord)

on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC = 9:00 a. m. en Jalisco
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node automation/discord/post.mjs
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
