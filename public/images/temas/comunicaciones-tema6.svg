<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#0b1d34"/>
  <text x="40" y="48" font-family='Arial, Helvetica, sans-serif' font-size="26" font-weight="700" fill="#ffffff">Reportes de posición en el circuito</text>
  <text x='40' y='78' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#7d8aa3'>Qué reportas en cada tramo del patrón</text>
  
      <rect x="390" y="350" width="20" height="80" fill="#ffffff"/>
      <text x="400" y="452" font-family='Arial, Helvetica, sans-serif' font-size="13" fill="#7d8aa3" text-anchor="middle">Pista</text>

      <!-- upwind: near-runway side, climbing out -->
      <line x1="580" y1="390" x2="580" y2="160" stroke="#cadcfc" stroke-width="3" marker-end="url(#pa5)"/>
      <text x="598" y="275" font-family='Arial, Helvetica, sans-serif' font-size="13" fill="#cadcfc">Viento inicial</text>

      <!-- crosswind: top, right to left -->
      <line x1="580" y1="160" x2="220" y2="160" stroke="#cadcfc" stroke-width="3" marker-end="url(#pa5)"/>
      <text x="400" y="146" font-family='Arial, Helvetica, sans-serif' font-size="13" fill="#cadcfc" text-anchor="middle">Viento cruzado</text>

      <!-- downwind: left side, parallel to runway, opposite direction -->
      <line x1="220" y1="160" x2="220" y2="390" stroke="#cadcfc" stroke-width="3" marker-end="url(#pa5)"/>
      <text x="202" y="275" font-family='Arial, Helvetica, sans-serif' font-size="13" fill="#cadcfc" text-anchor="end">Viento en cola</text>

      <!-- base: bottom, left to the runway centerline -->
      <line x1="220" y1="390" x2="400" y2="390" stroke="#cadcfc" stroke-width="3" marker-end="url(#pa5)"/>
      <text x="310" y="412" font-family='Arial, Helvetica, sans-serif' font-size="13" fill="#cadcfc" text-anchor="middle">Base</text>

      <!-- final: straight into the runway threshold -->
      <line x1="400" y1="390" x2="400" y2="350" stroke="#cadcfc" stroke-width="3" marker-end="url(#pa5)"/>
      <text x="414" y="370" font-family='Arial, Helvetica, sans-serif' font-size="13" fill="#cadcfc">Final</text>
    <g><rect x="25" y="257" width="190" height="34" rx="8" fill="#060e1a" stroke="#d4af37" stroke-width="1.2"/>
            <text x="120" y="280" font-family='Arial, Helvetica, sans-serif' font-size="11.5" fill="#f0d78c" text-anchor="middle">“Viento en cola pista 20”</text></g><g><rect x="215" y="427" width="190" height="34" rx="8" fill="#060e1a" stroke="#d4af37" stroke-width="1.2"/>
            <text x="310" y="450" font-family='Arial, Helvetica, sans-serif' font-size="11.5" fill="#f0d78c" text-anchor="middle">“Base pista 20”</text></g><g><rect x="405" y="352" width="190" height="34" rx="8" fill="#060e1a" stroke="#d4af37" stroke-width="1.2"/>
            <text x="500" y="375" font-family='Arial, Helvetica, sans-serif' font-size="11.5" fill="#f0d78c" text-anchor="middle">“Final pista 20”</text></g><defs><marker id="pa" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-fill"/></marker></defs><defs><marker id="pa5" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#cadcfc"/></marker></defs>
</svg>