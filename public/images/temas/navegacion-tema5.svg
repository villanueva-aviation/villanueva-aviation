<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#0b1d34"/>
  <text x="40" y="48" font-family='Arial, Helvetica, sans-serif' font-size="26" font-weight="700" fill="#ffffff">Cómo leer un CDI</text>
  <text x='40' y='78' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#7d8aa3'>Curso seleccionado, aguja de desviación y bandera TO/FROM</text>
  
      <circle cx="400" cy="260" r="150" fill="#102847" stroke="#7d8aa3" stroke-width="2"/>
      <!-- OBS course arrow (pointing up) -->
      <line x1="400" y1="400" x2="400" y2="120" stroke="#ffffff" stroke-width="2.5" marker-end="url(#cdiarrow)"/>
      <!-- deviation needle, offset to the right meaning course is to the right -->
      <line x1="435" y1="170" x2="435" y2="350" stroke="#e8c766" stroke-width="5"/>
      <circle cx="360" cy="260" r="4" fill="#7d8aa3"/><circle cx="338" cy="260" r="4" fill="#7d8aa3"/><circle cx="316" cy="260" r="4" fill="#7d8aa3"/><circle cx="294" cy="260" r="4" fill="#7d8aa3"/><circle cx="272" cy="260" r="4" fill="#7d8aa3"/><circle cx="440" cy="260" r="4" fill="#7d8aa3"/><circle cx="462" cy="260" r="4" fill="#7d8aa3"/><circle cx="484" cy="260" r="4" fill="#7d8aa3"/><circle cx="506" cy="260" r="4" fill="#7d8aa3"/><circle cx="528" cy="260" r="4" fill="#7d8aa3"/>
      <!-- TO flag -->
      <polygon points="384,210 416,210 400,182" fill="#d4af37"/>
      <text x="400" y="202" font-family='Arial, Helvetica, sans-serif' font-size="11" font-weight="700" fill="#060e1a" text-anchor="middle">TO</text>
      <defs><marker id="cdiarrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/></marker></defs>

      <text x="490" y="160" font-family='Arial, Helvetica, sans-serif' font-size="13" fill="#e8c766">Aguja de desviación</text>
      <text x="260" y="380" font-family='Arial, Helvetica, sans-serif' font-size="13" fill="#7d8aa3">Cada punto ≈ 2°</text>
      <text x="400" y="440" font-family='Arial, Helvetica, sans-serif' font-size="14" fill="#cadcfc" text-anchor="middle">Aguja a la derecha del centro → el curso está a tu derecha, vuelas hacia ella</text>
    
</svg>